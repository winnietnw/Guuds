        <div class="logo">
            <span class="logo-pill">Guuds</span>

        </div>

<body>
    <div class="login-wrapper">
    <div class="login-card">

        <div class="card-logo">Guuds</div>
        <h2>Welcome to Guuds</h2>

        <!-- TOGGLE -->
        <div class="toggle-buttons">
            <button id="login-admin" class="toggle-btn active" onclick="window.location.href='login-foradmin.html'">Login as adminstrator</button>
            <button id="Singup"class="toggle-btn " onclick="window.location.href='signup.html'">Sign Up</button>
        </div>
        <!-- FORM -->
        <form>
            <label>Username</label>
            <input type="text" required>

            <label>Email</label>
            <input type="email" required>

            <label>Password</label>
            <input type="password" required>

            <label>Confirm Password</label>
            <input type="password" required>

            <button class="btn-gradient">Create Account</button>
        </form>
    </div>
</div>
</body>

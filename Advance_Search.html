<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advance Search</title>

    <link rel="stylesheet" href="Advance_Search.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <header>
        <div class="nav-inner">
            <div class="logo">
                <span class="logo-pill">Guuds</span>
                <span class="gradient-text">K-pop Community Market</span>
            </div>

            <nav class="nav-links">
                <a href="Home.html">Home</a>
                <a href="Marketplace.html">Marketplace</a>
                <a href="Search.html">Search</a>
                <a href="Community.html">Communities</a>
                <a href="About.html">Team</a>
            </nav>

            <div class="circle">
                <i class="material-icons" onclick="window.location.href='UserProfile-Unverify.html'">person</i>
            </div>
        </div>
    </header>

    <div class="container animated-element" style="--animation-delay:120ms">

        <h1 class="page-title animated-element" style="--animation-delay:180ms">
            Advance Search
        </h1>

        <form class="search-form animated-element" style="--animation-delay:240ms">

            <div class="form-row animated-element" style="--animation-delay:300ms">
                <div class="form-label">Name</div>
                <input type="text" id="name" class="input">
            </div>

            <div class="form-row animated-element" style="--animation-delay:350ms">
                <div class="form-label">Category</div>
                <select id="category" class="input">
                    <option value="">Select Category</option>
                    <option value="albums">Albums</option>
                    <option value="photocard">Photocard</option>
                    <option value="poster">Poster</option>
                    <option value="accessories">Accessories</option>
                    <option value="lightstick">Light Stick</option>
                </select>
            </div>

            <div class="form-row animated-element" style="--animation-delay:400ms">
                <div class="form-label">Community</div>
                <input type="text" id="community" class="input">
            </div>
            <div class="form-row animated-element" style="--animation-delay:450ms">
                <div class="form-label">Rating</div>

                <div class="rating-group">
                    <button type="button" class="rating-btn" data-rating="5"><span class="star">★</span> 5</button>
                    <button type="button" class="rating-btn" data-rating="4"><span class="star">★</span> ≥4</button>
                    <button type="button" class="rating-btn" data-rating="3"><span class="star">★</span> ≥3</button>
                    <button type="button" class="rating-btn" data-rating="2"><span class="star">★</span> ≥2</button>
                    <button type="button" class="rating-btn" data-rating="1"><span class="star">★</span> ≥1</button>
                </div>
            </div>

            <div class="form-row animated-element" style="--animation-delay:500ms">
                <div class="form-label">Availability</div>

                <div class="availability">
                    <label><input type="checkbox" id="in-stock" checked> In Stock</label>
                    <label><input type="checkbox" id="out-stock" checked> Out Of Stock</label>
                </div>
            </div>

            <div class="actions animated-element" style="--animation-delay:550ms">
                <button type="button" class="btn-search" id="searchBtn">Search</button>
                <button type="button" class="btn-clear" id="clearBtn">Clear</button>
            </div>

        </form>
    </div>

    <footer class="footer animated-element" style="--animation-delay:600ms">
        <div class="footer-content">

            <div class="footer-top">
                <div class="footer-logo">
                    <span>Guuds</span>
                </div>
                <span class="footer-tagline">K-pop Community Market</span>
            </div>

            <a href="About.html" class="footer-link">About</a>
        </div>
    </footer>
    <script src="Advance_Search.js"></script>
</body>

</html>

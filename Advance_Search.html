<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advance Search</title>
    <link rel="stylesheet" href="Advance_Search.css">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <div class="logo-box">
                <span class="logo-text">Guuds</span>
            </div>
            <span class="tagline">K-pop Community Market</span>
        </div>

        <nav class="nav">
            <a href="Home.html">Home</a>
            <a href="Market_Place.html">Marketplace</a>
            <a href="Search.html" class="active">Search</a>
            <a href="Communities.html">Communities</a>
            <a href="Team.html">Team</a>
        </nav>

        <div class="avatar"></div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">
        <h1 class="page-title">Advance Search</h1>

        <form class="search-form">

            <!-- Name -->
            <div class="form-row">
                <div class="form-label">Name</div>
                <input type="text" id="name" class="input">
            </div>

            <!-- Category -->
            <div class="form-row">
                <div class="form-label">Category</div>
                <select id="category" class="input">
                    <option value="">Select Category</option>
                    <option value="albums">Albums</option>
                    <option value="photocard">Photocard</option>
                    <option value="poster">Poster</option>
                    <option value="accessories">Accessories</option>
                    <option value="lightstick">Light Stick</option>
                </select>
            </div>

            <!-- Community -->
            <div class="form-row">
                <div class="form-label">Community</div>
                <input type="text" id="community" class="input">
            </div>

            <!-- Rating -->
            <div class="form-row">
                <div class="form-label">Rating</div>

                <div class="rating-group">
                    <button class="rating-btn" data-rating="5">★ 5</button>
                    <button class="rating-btn" data-rating="4">★ ≥4</button>
                    <button class="rating-btn" data-rating="3">★ ≥3</button>
                    <button class="rating-btn" data-rating="2">★ ≥2</button>
                    <button class="rating-btn" data-rating="1">★ ≥1</button>
                </div>
            </div>

            <!-- Availability -->
            <div class="form-row">
                <div class="form-label">Availability</div>

                <div class="availability">
                    <label><input type="checkbox" id="in-stock" checked> In Stock</label>
                    <label><input type="checkbox" id="out-stock" checked> Out Of Stock</label>
                </div>
            </div>

            <!-- Buttons -->
            <div class="actions">
                <button type="button" class="btn-search" id="searchBtn">Search</button>
                <button type="button" class="btn-clear" id="clearBtn">Clear</button>
            </div>

        </form>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
    <div class="footer-content">

        <div class="footer-top">
            <div class="footer-logo">
                <span>Guuds</span>
            </div>
            <span class="footer-tagline">K-pop Community Market</span>
        </div>

        <a href="About.html" class="footer-link">About</a>
    </div>
</footer>

    <script src="Advance_Search.js"></script>
</body>
</html>

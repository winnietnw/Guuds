<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>User Profile – Unverified</title>
  <link rel="stylesheet" href="Profile.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <div class="nav-inner">

      <div class="logo">
        <span class="logo-pill">Guuds</span>
        <span class="gradient-text">K-pop Community Market</span>
      </div>

      <nav class="nav-links">
        <a href="Home.html">Home</a>
        <a href="Marketplace.html">Marketplace</a>
        <a href="Search.html">Search</a>
        <a href="Community.html">Communities</a>
        <a href="About.html">Team</a>
      </nav>


    </div>

  </header>


  <!-- MAIN CONTENT -->
  <div class="page">

    <div class="profile-card">

      <div class="top-icons">

        <!-- NEW VERIFY ICON -->
        <div class="verify-pill2">
          <div class="verify-star"></div>
          <span>Verify Account</span>
        </div>

        <!-- Cart -->
        <div class="icon-gradient"
          style="--icon: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path fill=%22black%22 d=%22M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7l1.1-2h7.45c.75 0 1.41-.41 1.75-1.03L21 6H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z%22/></svg>');">
        </div>

        <!-- Settings -->
        <div class="icon-gradient"
          style="--icon: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path fill=%22black%22 d=%22M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32a.495.495 0 0 0-.6-.22l-2.39.96a7.027 7.027 0 0 0-1.63-.94l-.36-2.54A.488.488 0 0 0 14.28 2h-4.56c-.24 0-.44.17-.48.4l-.36 2.54c-.6.24-1.15.55-1.63.94l-2.39-.96a.495.495 0 0 0-.6.22L2.75 7.87c-.12.21-.07.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.21.38.3.6.22l2.39-.96c.48.39 1.03.7 1.63.94l.36 2.54c.04.23.24.4.48.4h4.56c.24 0 .44-.17.48-.4l.36-2.54c.6-.24 1.15-.55 1.63-.94l2.39.96c.23.09.49-.01.6-.22l1.92-3.32a.495.495 0 0 0-.12-.61l-2.03-1.58zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z%22/></svg>');">
        </div>

      </div>


      <span class="brand-pill">Guuds</span>


      <div class="avatar-wrap">
        <div class="avatar">
          <i class="material-icons user-icon">person</i>

          <div class="edit-avatar" onclick="window.location.href='EditProfile.html'">
            <i class="material-icons">edit</i>
          </div>

        </div>
      </div>

      <h2 class="username">
        <i class="material-icons small-verify">verified</i>Hello, [username]
      </h2>



      <div class="menu-grid">

        <div class="menu-item">
          <div class="menu-icon menu-wallet"></div>
          <p>To pay</p>
        </div>

        <div class="menu-item">
          <div class="menu-icon menu-ship"></div>
          <p>To ship</p>
        </div>

        <div class="menu-item">
          <div class="menu-icon menu-send"></div>
          <p>To send</p>
        </div>

      </div>


      <div class="mode-switch">Publisher Mode</div>

      <!-- Logout -->
      <button class="logout-btn" onclick="window.location.href='Home.html'">
        Log out
      </button>

    </div>

  </div>
  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="logo">
        <span class="logo-pill">Guuds</span>
        <span class="logo-text">K-pop Community Market</span>
      </div>

      <ul class="footer-links">
        <li><a href="about.html">About</a></li>
      </ul>
    </div>
  </footer>
</body>

</html>

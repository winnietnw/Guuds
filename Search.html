<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search | Guuds K-pop</title>
    <link rel="stylesheet" href="Search.css" />
</head>

<body>

    <header class="header">
        <div class="header-nav-container">
            <div class="logo-group animated-element" style="--animation-delay:0ms">
                <div class="logo-tagline">
                    <div class="logo-box">
                        <span class="logo-text">Guuds</span>
                    </div>
                    <span class="tagline-text">K-pop Community Market</span>
                </div>
            </div>

            <div class="nav-avatar-group animated-element" style="--animation-delay:200ms">
                <nav id="header-nav" class="header-links"></nav>

                <div class="header-avatar">
                    <img 
                        alt="User avatar"
                        src="https://c.animaapp.com/mi1npewox6dlCb/img/generic-avatar.svg"
                    />
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="search-container">
            <h1 class="search-title animated-element" style="--animation-delay:300ms">
                Search
            </h1>

            <div class="input-group animated-element" style="--animation-delay:400ms">
                <input type="text" placeholder="Search" class="search-input" />
                <button class="search-icon-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon-svg">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

            <div class="action-group animated-element" style="--animation-delay:500ms">
                <a href="Advance_Search.html" class="advance-search-link">Advance Search</a>
                <button class="search-btn">Search</button>
            </div>
        </div>
    </main>

    <footer id="footer-section" class="footer-section">
        <div class="footer-content-wrapper">
            <div class="footer-logo-tagline">
                <div class="footer-logo-box">
                    <span class="footer-logo-text">Guuds</span>
                </div>
                <span class="footer-tagline-text">K-pop Community Market</span>
            </div>

            <nav class="footer-nav">
                <a href="About.html">About</a>
            </nav>
        </div>
    </footer>

    <script src="Search.js"></script>
</body>
</html>

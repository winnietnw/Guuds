<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Guuds K-pop</title>
    <!-- external CSS -->
    <link rel="stylesheet" href="Market_Place.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>

<body>
    <header class="navbar">
        <div class="nav-inner">
            <div class="logo">
                <span class="logo-pill">Guuds</span>
                <span class="gradient-text">K-pop Community Market</span>
            </div>

            <nav class="nav-links">
                <a href="Home.html">Home</a>
                <a href="Marketplace.html">Marketplace</a>
                <a href="Search.html" class="active">Search</a>
                <a href="Community.html">Communities</a>
                <a href="About.html">Team</a>
            </nav>

            <div class="circle">
                <i class="material-icons" onclick="window.location.href='UserProfile-Unverify.html'">person</i>
            </div>
        </div>
    </header>

    <main>
        <h1 class="marketplace-title animated-element" style="--animation-delay:300ms">
            Marketplace
        </h1>

        <div id="category-bar-container" class="category-bar animated-element" style="--animation-delay:350ms"></div>

        <div class="sort-bar animated-element" style="--animation-delay:400ms">
            <span class="sort-label">
                Sort by:
            </span>

            <div id="sort-options-container" class="sort-options">
            </div>
            <a href="ShoppingCart.html" class="cart-icon-btn">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="cartGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:var(--vibrant-pink);stop-opacity:1" />
                            <stop offset="100%" style="stop-color:var(--vibrant-purple);stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="8" cy="21" r="1" />
                    <circle cx="19" cy="21" r="1" />
                    <path d="M2.05 2h2l2.66 12.42a2 2 0 0 0 2 1.58h9.72a2 2 0 0 0 2-1.58L23 6H6"
                        stroke="url(#cartGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
        </div>

        <div class="main-layout">

            <aside id="filters-sidebar-container" class="filters-sidebar animated-element"
                style="--animation-delay:500ms">
            </aside>

            <section id="marketplace-grid-section" class="product-grid-container animated-element"
                style="--animation-delay:600ms">
                <div id="marketplace-grid" class="product-grid">
                </div>
            </section>
        </div>
    </main>

    <footer id="footer-section" class="footer-section">
        <div class="footer-content-wrapper">
            <div id="footer-logo-tagline" class="footer-logo-tagline animated-element" style="--animation-delay:0ms">
                <div class="footer-logo-box">
                    <span class="footer-logo-text">Guuds</span>
                </div>
                <span class="footer-tagline-text">
                    K-pop Community Market
                </span>
            </div>

            <nav id="footer-nav" class="footer-nav animated-element" style="--animation-delay:200ms">
                <a href="About.html" class="footer-link">About</a>
            </nav>

            <div id="footer-social-icons" class="footer-social-icons animated-element" style="--animation-delay:400ms">
            </div>
        </div>
    </footer>

    <!-- external JS -->
    <script src="Market_Place.js"></script>
</body>

</html>

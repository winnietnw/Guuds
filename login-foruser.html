<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guuds Login</title>
    <link rel="stylesheet" href="00-login-Team-Payment.css">
</head>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<header class="navbar">
    <div class="nav-inner">
        <div class="logo">
            <span class="logo-pill">Guuds</span>
            <span class="gradient-text">K-pop Community Market</span>

        </div>

        <nav class="nav-links">
            <a href="Home.html">Home</a>
            <a href="Marketplace.html">Marketplace</a>
            <a href="Search.html">Search</a>
            <a href="Community.html">Communities</a>
            <a href="About.html">Team</a>
        </nav>

        <div class="circle">
            <i class="material-icons" onclick="window.location.href='profile.html'">person</i>
        </div>
</header>

<body>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="card-logo">Guuds</div>
            <h2>Welcome to Guuds</h2>

            <!-- TOGGLE -->
            <div class="toggle-buttons">
                <button id="login-admin" class="toggle-btn active"
                    onclick="window.location.href='login-foradmin.html'">Login as adminstrator</button>
                <button id="Singup" class="toggle-btn " onclick="window.location.href='signup.html'">Sign Up</button>
            </div>

            <!-- FORM -->
            <form>
                <label>Username</label>
                <input type="text" required>

                <label>Password</label>
                <input type="password" required>

                <button class="btn-gradient">Sign In</button>

                <a href="forgot-pass.html" class="forgot">Forgot password?</a>
            </form>

        </div>
    </div>
</body>

<footer class="footer">
    <div class="footer-inner">
        <div class="logo">
            <span class="logo-pill">Guuds</span>
            <span class="logo-text">K-pop Community Market</span>
        </div>

        <ul class="footer-links">
            <li><a href="about.html">About</a></li>
    </div>
</footer>

<script src="script.js"></script>


</html>

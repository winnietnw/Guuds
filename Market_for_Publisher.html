<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Guuds K-pop</title>

    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="Market_for_Publisher.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-inner">
            <div class="logo">
                <span class="logo-pill">Guuds</span>
                <span class="gradient-text">K-pop Community Market</span>
            </div>

            <nav class="nav-links">
                <a href="Home.html">Home</a>
                <a class="active" href="Marketplace.html">Marketplace</a>
                <a href="Search.html">Search</a>
                <a href="Community.html">Communities</a>
                <a href="About.html">Team</a>
            </nav>

            <div class="circle">
                <i class="material-icons" onclick="window.location.href='UserProfile-Unverify.html'">person</i>
            </div>
        </div>
    </header>

    <main>
        <h1 class="marketplace-title animated-element" style="--animation-delay:300ms">
            Marketplace
        </h1>

        <div id="category-bar-container" class="category-bar animated-element" style="--animation-delay:350ms"></div>

        <div class="sort-bar animated-element" style="--animation-delay:400ms">
            <span class="sort-label">Sort by:</span>

            <div id="sort-options-container" class="sort-options"></div>

            <button id="add-to-list-btn" class="add-to-list-btn">
                <a class="icon-circle-bg" href="Add_Product.html" >
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="file-plus-svg">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                </a>
            </button>
        </div>

        <div class="main-layout">
            <aside id="filters-sidebar-container" class="filters-sidebar animated-element" style="--animation-delay:500ms"></aside>

            <section id="marketplace-grid-section" class="product-grid-container animated-element" style="--animation-delay:600ms">
                <div id="marketplace-grid" class="product-grid"></div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer id="footer-section" class="footer-section">
        <div class="footer-content-wrapper">
            <div class="footer-logo-tagline">
                <div class="footer-logo-box">
                    <span class="footer-logo-text">Guuds</span>
                </div>
                <span class="footer-tagline-text">K-pop Community Market</span>
            </div>

            <nav class="footer-nav">
                <a href="About.html" class="footer-link">About</a>
            </nav>

            <div id="footer-social-icons" class="footer-social-icons"></div>
        </div>
    </footer>

    <!-- JS -->
    <script src="Market_for_Publisher.js"></script>
</body>
</html>
